<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SENIM</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; max-width: 520px; color: #142019; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit; border: 1px solid #c9d3cd; border-radius: 8px; }
    button { margin-top: 12px; padding: 8px 16px; font: inherit; color: #fff; background: #0B6E4F; border: 0; border-radius: 8px; cursor: pointer; }
    p { color: #4a5a51; font-size: 13px; }
  </style>
</head>
<body>
  <label for="site" data-i18n="optionsSite"></label>
  <input id="site" type="url" placeholder="https://senim-fawn.vercel.app">
  <p data-i18n="optionsHelp"></p>
  <button id="save" data-i18n="optionsSave"></button>
  <span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>

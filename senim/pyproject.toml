# Used by Vercel to deploy the FastAPI backend (see ../README.md). Local runs still use requirements.txt.
[project]
name = "senim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]

[tool.vercel]
entrypoint = "senim.app:app"
